name: CI

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        run: npx expo-doctor || true # Hermes V1 回归需 SDK 57，已知风险见审计报告

      - name: Lint
        run: npm run lint

      - name: Unit tests
        shell: bash
        run: |
          set +e
          npm test -- --runInBand --json --outputFile=/tmp/jest-results.json
          test_status=$?
          if [ "$test_status" -ne 0 ] && [ -f /tmp/jest-results.json ]; then
            node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/jest-results.json', 'utf8'));
          const escape = (value) => String(value || '')
            .replace(/%/g, '%25')
            .replace(/\r/g, '%0D')
            .replace(/\n/g, '%0A');
          for (const suite of result.testResults || []) {
            if (suite.status !== 'failed' && !(suite.assertionResults || []).some((item) => item.status === 'failed')) continue;
            const failed = (suite.assertionResults || []).filter((item) => item.status === 'failed');
            const names = failed.map((item) => item.fullName || item.title).join(' | ') || '测试文件加载失败';
            const detail = failed.flatMap((item) => item.failureMessages || []).join('\n') || suite.message || 'Jest suite failed';
            const first = detail.split('\n').slice(0, 16).join('\n');
            console.log(`::error file=${escape(suite.name)},title=Jest failed: ${escape(names)}::${escape(first)}`);
          }
          NODE
          fi
          exit "$test_status"
