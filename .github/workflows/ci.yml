name: CI

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        run: npx expo-doctor || true # Hermes V1 回归需 SDK 57，已知风险见审计报告

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
